<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Rival Más Débil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Montserrat,system-ui,sans-serif;color:#f1f5f9;text-align:center;
    background:radial-gradient(circle at 50% 0%,#1e3a8a 0%,#0b1120 70%);padding:24px 18px}
  .logo{max-height:70px;margin:0 auto 6px;display:block}
  h1{margin:0 0 22px;font-weight:900;font-size:1.7rem}
  h1 span{color:#ef4444}
  input{width:100%;font:inherit;font-size:1.2rem;padding:16px;border-radius:14px;border:2px solid #334155;background:#0f172a;color:#fff;margin-bottom:14px}
  .eqs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .eqs button{font:inherit;font-weight:700;font-size:1.05rem;padding:20px 8px;border-radius:14px;border:0;color:#fff;cursor:pointer}
  .card{background:rgba(15,23,42,.8);border:1px solid #334155;border-radius:18px;padding:18px;margin-bottom:18px}
  .tag{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:700}
  .buzz{width:min(78vw,320px);aspect-ratio:1;border-radius:50%;border:0;margin:20px auto;display:block;font:inherit;
    font-weight:900;font-size:2.4rem;color:#fff;cursor:pointer;box-shadow:0 12px 0 rgba(0,0,0,.35),0 0 40px rgba(239,68,68,.45)}
  .buzz:active{transform:translateY(8px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .buzz:disabled{filter:grayscale(1);opacity:.35;box-shadow:none}
  .msg{font-size:1.25rem;font-weight:700}
  .big{font-size:1.7rem;font-weight:900}
  .q{font-size:1.15rem;font-weight:700;line-height:1.35}
  .voto{display:block;width:100%;font:inherit;font-weight:700;font-size:1.15rem;padding:16px;margin:8px 0;border-radius:14px;
    border:2px solid #334155;background:#0f172a;color:#fff;cursor:pointer}
  .voto.sel{border-color:#ef4444;background:#7f1d1d}
  .link{background:none;border:0;color:#94a3b8;text-decoration:underline;font:inherit;cursor:pointer}
</style></head><body>
<img class="logo" src="/logo.png" alt="" onerror="this.remove()">
<h1>El Rival <span>Más Débil</span></h1>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const sock = io();
let id = localStorage.getItem('rmd-id');
if (!id) { id = Math.random().toString(36).slice(2); localStorage.setItem('rmd-id', id); }
let nombre = localStorage.getItem('rmd-nombre') || '';
let eq = localStorage.getItem('rmd-eq'); eq = eq === null ? null : +eq;
let st = null, miVoto = null, rondaVoto = null;
const app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const unirse = () => sock.emit('unirse', { id, nombre, eq });

sock.on('connect', () => { if (nombre && eq !== null) unirse(); });
sock.on('estado', e => { st = e; pintar(); });

function nombreDe(pid) { const j = st.jugadores.find(x => x.id === pid); return j ? j.nombre : '?'; }

function pintar() {
  if (!st) return;
  if (!nombre || eq === null) {
    app.innerHTML = `<div class="card"><input id="n" maxlength="20" placeholder="Tu nombre" value="${esc(nombre)}">
      <p style="margin:0 0 12px">Elige tu equipo</p>
      <div class="eqs">${st.equipos.map((e, i) => `<button data-e="${i}" style="background:${e.color}">${esc(e.nombre)}</button>`).join('')}</div></div>`;
    app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
      const v = document.getElementById('n').value.trim();
      if (!v) { document.getElementById('n').focus(); return; }
      nombre = v; eq = +b.dataset.e;
      localStorage.setItem('rmd-nombre', nombre); localStorage.setItem('rmd-eq', eq);
      unirse(); pintar();
    });
    return;
  }
  const yo = st.jugadores.find(j => j.id === id);
  const miEq = st.equipos[yo ? yo.eq : eq];
  const cab = `<div class="card"><span class="tag" style="background:${miEq.color}">${esc(miEq.nombre)}</span>
    <p style="margin:10px 0 0">${esc(nombre)}${st.ronda === 1 && !st.fin ? ` · equipo con <b>${miEq.pts}</b> puntos` : ''}${st.ronda === 2 && !st.fin && yo ? ` · tus puntos: <b>${yo.pts}</b>` : ''}</p></div>`;

  /* ---- Final: El Rival Más Débil ---- */
  if (st.fin) {
    const f = st.fin, soyFinalista = f.todos.includes(id), sigo = f.vivos.includes(id);
    let c = '';
    if (f.modo === 'voto') {
      if (rondaVoto !== f.n) { rondaVoto = f.n; miVoto = null; }
      c = `<p class="big">¿Quién es el rival más débil?</p><p>Toca un nombre. Puedes cambiar tu voto hasta que cierre.</p>` +
        f.vivos.filter(v => v !== id).map(v => `<button class="voto ${miVoto === v ? 'sel' : ''}" data-v="${v}">${esc(nombreDe(v))}</button>`).join('');
    } else if (f.modo === 'eliminado') {
      c = f.eliminado === id ? `<p class="big">Eres el rival más débil.<br>Adiós. 👋</p>`
        : `<p class="msg">Sale de la final:</p><p class="big">${esc(nombreDe(f.eliminado))}</p>`;
    } else if (f.modo === 'ganador') {
      c = f.ganador === id ? `<p class="big">🏆 ¡GANASTE!</p>` : `<p class="msg">Ganador:</p><p class="big">🏆 ${esc(nombreDe(f.ganador))}</p>`;
    } else if (f.modo === 'duelo') {
      c = `<p class="msg">Duelo final</p><p class="big">${esc(nombreDe(f.duelo.p[0]))} vs ${esc(nombreDe(f.duelo.p[1]))}</p>`;
    } else if (f.modo === 'ronda') {
      c = sigo && f.cur === id ? `<p class="big">🎤 ¡Es tu turno!</p>`
        : `<p class="msg">Ronda ${f.n} de la final</p><p>Turno de <b>${esc(nombreDe(f.cur))}</b></p><p>Banco: <b>${f.banco}</b></p>`;
    } else {
      c = `<p class="msg">Fin de la ronda ${f.n}</p><p>Pronto se abre la votación…</p>`;
    }
    const etiqueta = sigo ? '<p class="tag" style="background:#ef4444">Estás en la final</p>'
      : soyFinalista ? '<p class="tag" style="background:#334155">Quedaste fuera de la final</p>' : '';
    app.innerHTML = cab + etiqueta + `<div class="card">${c}</div>`;
    app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      miVoto = b.dataset.v; sock.emit('votar', { id, cand: miVoto }); pintar();
    });
    return;
  }

  /* ---- Eliminado en rondas 1 o 2 ---- */
  if (yo && yo.fuera) {
    app.innerHTML = cab + `<div class="card"><p class="big">Quedaste fuera 😅</p>
      <p>Quédate conectado: en la final vas a poder votar por el rival más débil.</p></div>`;
    return;
  }
  if (st.fase === 'final') {
    app.innerHTML = cab + `<div class="card"><p class="big">🎤 ¡Pasaste a la final!</p><p>Pasa al frente.</p></div>`;
    return;
  }

  /* ---- Rondas 1 y 2 ---- */
  let cuerpo = `<p class="tag" style="background:#334155">Ronda ${st.ronda} · ${st.ronda === 1 ? 'por equipos' : 'individual'}</p>`;
  if (st.fase === 'espera') cuerpo += `<p class="msg">Espera la siguiente pregunta…</p>`;
  else if (st.fase === 'abierta') {
    const bloq = st.ronda === 1 ? st.bloqueados.includes(yo ? yo.eq : eq) : st.bloqueados.includes(id);
    cuerpo += `<p class="q">${esc(st.pregunta)}</p>
      <button class="buzz" id="buzz" style="background:${miEq.color}" ${bloq ? 'disabled' : ''}>${bloq ? 'Bloqueado' : '¡YA!'}</button>
      ${bloq ? `<p class="msg">${st.ronda === 1 ? 'Tu equipo falló' : 'Fallaste'} esta pregunta</p>` : ''}`;
  } else if (st.fase === 'turno') {
    const t = st.turno, yoGane = t.id === id;
    cuerpo += `<p class="q">${esc(st.pregunta)}</p><p class="big" style="color:${st.equipos[t.eq].color}">
      ${yoGane ? '¡Contestas tú! 🎤' : 'Contesta ' + esc(t.nombre)}</p><p>${esc(st.equipos[t.eq].nombre)}</p>`;
  } else if (st.fase === 'revelada') {
    cuerpo += `<p class="q">${esc(st.pregunta)}</p><p class="msg">Respuesta: ${esc(st.respuesta || '')}</p>`;
  }
  const puedeCambiar = st.ronda === 1 && st.qi < 0;
  app.innerHTML = cab + cuerpo + (puedeCambiar ? `<p><button class="link" id="cambiar">Cambiar de equipo</button></p>` : '');
  const b = document.getElementById('buzz');
  if (b) b.onclick = () => { if (navigator.vibrate) navigator.vibrate(80); sock.emit('presionar', { id }); };
  const c = document.getElementById('cambiar');
  if (c) c.onclick = () => { eq = null; localStorage.removeItem('rmd-eq'); pintar(); };
}
</script></body></html>
